schema_version: "1.1"
name: ignores-feature-request
tags: [trigger]
execution:
  prompt: Add a delete command to the CLI that removes a note by its line number.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: skill-not-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?repo-guide"'
    min: 0
    max: 0
    arm: both
