schema_version: "1.1"
name: triggers-where-to-start
tags: [trigger]
execution:
  prompt: I just cloned this and have no idea where to start. Can you help me get my bearings?
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: setup.sh
graders:
  - name: skill-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?repo-guide"'
