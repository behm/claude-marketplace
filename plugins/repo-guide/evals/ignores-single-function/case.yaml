schema_version: "1.1"
name: ignores-single-function
tags: [trigger]
execution:
  prompt: What does listNotes in src/store.js return when the notes file doesn't exist?
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: setup.sh
graders:
  - name: skill-not-used
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?repo-guide"'
    min: 0
    max: 0
    arm: both
