schema_version: "1.1"
name: stays-read-only
tags: [quality]
execution:
  prompt: Get me up to speed on this repo. The README looks pretty thin.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
